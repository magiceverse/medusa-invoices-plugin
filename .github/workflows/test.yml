name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24

    runs-on: [self-hosted, linux, x64, light]

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn test:unit

  admin-tests:
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24

    runs-on: [self-hosted, linux, x64, light]

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - run: yarn install --immutable
      - run: yarn test:admin

  integration-tests:
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24
        medusa-version:
          - version: "2.11.3"
            swc-core: "1.7.42"
          - version: "2.12.6"
            swc-core: "1.7.42"
          - version: "2.13.1"
            swc-core: "1.7.42"

    runs-on: [self-hosted, linux, x64, ci]

    steps:
      - uses: actions/checkout@v4
      - name: Start Redis and Postgres next to the job
        run: |
          # `services:` would publish ports on the host's Docker daemon (the runner is itself a container on it): parallel jobs would clash on 5432/6379
          # and the ports would not be localhost for the job. The services share the network namespace of this runner container instead.
          redis="svc-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ strategy.job-index }}"
          pg="svc-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ strategy.job-index }}"
          echo "SVC_REDIS=$redis" >> "$GITHUB_ENV"
          echo "SVC_PG=$pg" >> "$GITHUB_ENV"
          docker run -d --name "$redis" --network "container:$(hostname)" redis:7 >/dev/null
          docker run -d --name "$pg" --network "container:$(hostname)" \
            -e POSTGRES_USER=postgres -e POSTGRES_DB=medusa_test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16 >/dev/null
          timeout 120 bash -c "until docker exec $redis redis-cli ping >/dev/null 2>&1 && docker exec $pg pg_isready -U postgres -d medusa_test >/dev/null 2>&1; do sleep 2; done"
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - run: yarn install --immutable
      - name: Install Medusa version ${{ matrix.medusa-version.version }}
        run: |
          yarn add -D \
            @medusajs/admin-sdk@${{ matrix.medusa-version.version }} \
            @medusajs/cli@${{ matrix.medusa-version.version }} \
            @medusajs/framework@${{ matrix.medusa-version.version }} \
            @medusajs/icons@${{ matrix.medusa-version.version }} \
            @medusajs/medusa@${{ matrix.medusa-version.version }} \
            @medusajs/test-utils@${{ matrix.medusa-version.version }} \
            @swc/core@${{ matrix.medusa-version.swc-core }}
      - run: yarn test:integration:http
        env:
          DB_TEMP_NAME: medusa_test
      - run: yarn test:integration:modules
        env:
          DB_TEMP_NAME: medusa_test
      - name: Remove Redis and Postgres
        if: always()
        run: docker rm -f "$SVC_REDIS" "$SVC_PG" >/dev/null 2>&1 || true
